appId: ${HAPPIER_E2E_MOBILE_APP_ID}
---
- launchApp:
    clearState: false

- runFlow:
    file: _shared/connectDevClientIfNeeded.yaml

- runFlow:
    file: _shared/gotoNewSessionComposer.yaml

- assertVisible:
    id: agent-input-action-menu-button
- tapOn:
    id: agent-input-action-menu-button
- assertVisible:
    id: 'agent-input-action-menu-item:mode'
- tapOn:
    id: 'agent-input-action-menu-item:mode'
- assertNotVisible:
    id: agent-input-action-menu-overlay

- tapOn:
    point: 10%,10%
